# (conf.d files are included inside the http block)
# login endpoints: a first line of defence before the API's own limits
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # the API trusts X-Forwarded-For (TRUST_PROXY=1): overwrite it, never append what
    # the client sent, or rate limits could be dodged with a fake header
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/;
    }
    location /api/ {
        proxy_pass http://api:8000/;
    }
    location /static/ {
        proxy_pass http://api:8000/static/;
        expires 7d;
    }
    # hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # single-page app with a hash router: everything else is index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
